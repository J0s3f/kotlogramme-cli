name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
          - macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test
        shell: bash
        run: ./gradlew --no-daemon clean test
      - name: Build the fat jar
        shell: bash
        run: ./gradlew --no-daemon shadowJar
      - name: Verify the fat jar
        shell: bash
        env:
          # Any values work: doctor must not reach Telegram, it only loads the native library.
          TG_API_ID: '1'
          TG_API_HASH: '0'
        run: |
          java -jar build/libs/kotlogramme-all.jar --version
          java -jar build/libs/kotlogramme-all.jar doctor
          native_count="$(jar tf build/libs/kotlogramme-all.jar | grep -cE '^native/.*\.(dll|so|dylib)$')"
          jar tf build/libs/kotlogramme-all.jar | grep -E '^native/.*\.(dll|so|dylib)$' || true
          echo "native entries: $native_count"
          test "$native_count" -eq 6
