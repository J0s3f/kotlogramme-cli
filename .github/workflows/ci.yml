name: ci

on:
  push:
    # A release tag runs the same tests and builds through the release workflow.
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  native:
    uses: ./.github/workflows/native.yml
