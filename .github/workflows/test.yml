name: tests

# The checks every commit has to pass, shared by ci (branches and pull requests) and by the release,
# so a release runs exactly what ci runs instead of relying on an earlier ci run.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
          - macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Test release version updates
        shell: bash
        run: bash scripts/test-version.sh
      - name: Check the documentation encoding
        shell: bash
        run: bash scripts/check-encoding.sh
      - name: Build and test
        shell: bash
        run: ./gradlew --no-daemon clean test
      - name: Build the fat jar
        shell: bash
        run: ./gradlew --no-daemon shadowJar
      - name: Verify the fat jar
        shell: bash
        run: |
          java -jar build/libs/kotlogramme-all.jar --version
          java -jar build/libs/kotlogramme-all.jar doctor
          native_count="$(jar tf build/libs/kotlogramme-all.jar | grep -cE '^native/.*\.(dll|so|dylib)$')"
          jar tf build/libs/kotlogramme-all.jar | grep -E '^native/.*\.(dll|so|dylib)$' || true
          echo "native entries: $native_count"
          test "$native_count" -eq 6

  windows-arm:
    # GraalVM has no Windows ARM64 Native Image toolchain; verify the JVM facade there.
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: liberica
          java-version: '25'
          architecture: aarch64
      - uses: gradle/actions/setup-gradle@v6
      - name: Test release version updates
        shell: bash
        run: bash scripts/test-version.sh
      - name: Check the documentation encoding
        shell: bash
        run: bash scripts/check-encoding.sh
      - name: Build and test the Windows ARM64 JVM distribution
        shell: pwsh
        run: .\gradlew.bat --no-daemon clean test shadowJar
      - name: Verify the Windows ARM64 native facade loads
        shell: pwsh
        run: |
          java -jar build/libs/kotlogramme-all.jar doctor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
