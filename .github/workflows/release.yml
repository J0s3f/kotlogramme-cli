name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version to publish, without the v prefix
        required: true
        type: string

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7
      - name: Determine and validate the release version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          version="${REQUESTED_VERSION:-${GITHUB_REF_NAME#v}}"
          test -n "$version"
          bash scripts/test-version.sh
          bash scripts/version.sh check "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"

  native:
    needs: version
    uses: ./.github/workflows/native.yml
    with:
      version: ${{ needs.version.outputs.value }}

  release:
    needs: [version, native]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test the release
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.value }}
        run: ./gradlew --no-daemon -Pversion="$RELEASE_VERSION" clean test
      - name: Build the fat jar and the distribution
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.value }}
        run: ./gradlew --no-daemon -Pversion="$RELEASE_VERSION" shadowJar distZip
      - name: Verify the fat jar bundles every native library
        shell: bash
        run: |
          jar tf build/libs/kotlogramme-all.jar | grep -E '^native/(linux-x86_64/libkotlogramme\.so|linux-aarch64/libkotlogramme\.so|windows-x86_64/kotlogramme\.dll|windows-aarch64/kotlogramme\.dll|macos-x86_64/libkotlogramme\.dylib|macos-aarch64/libkotlogramme\.dylib)$'
      - name: Download verified native packages
        uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: release-assets
          merge-multiple: true
      - name: Verify all five native packages are present
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.value }}
        run: |
          for platform in linux-x86_64 linux-aarch64 macos-x86_64 macos-aarch64; do
            test -s "release-assets/kotlogramme-$RELEASE_VERSION-$platform.tar.gz"
          done
          test -s "release-assets/kotlogramme-$RELEASE_VERSION-windows-x86_64.zip"
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.version.outputs.value }}
        shell: bash
        run: |
          tag="v$RELEASE_VERSION"
          gh release create "$tag" \
            --title "$tag" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            build/libs/kotlogramme-all.jar \
            build/distributions/*.zip \
            release-assets/*