name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version to publish, without the v prefix
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Determine the release version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          test -n "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Check the docs name this release
        shell: bash
        run: bash scripts/version.sh check "${{ steps.version.outputs.value }}"
      - name: Build and test the release
        shell: bash
        run: ./gradlew --no-daemon -Pversion="${{ steps.version.outputs.value }}" clean test
      - name: Build the fat jar and the distribution
        shell: bash
        run: ./gradlew --no-daemon -Pversion="${{ steps.version.outputs.value }}" shadowJar distZip
      - name: Verify the fat jar bundles every native library
        shell: bash
        run: |
          jar tf build/libs/kotlogramme-all.jar | grep -E '^native/(linux-x86_64/libkotlogramme\.so|linux-aarch64/libkotlogramme\.so|windows-x86_64/kotlogramme\.dll|windows-aarch64/kotlogramme\.dll|macos-x86_64/libkotlogramme\.dylib|macos-aarch64/libkotlogramme\.dylib)$'
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="v${{ steps.version.outputs.value }}"
          gh release create "$tag" \
            --title "$tag" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            build/libs/kotlogramme-all.jar \
            build/distributions/*.zip
